[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dogen"
version = "0.0.0"
description = "Agentic documentation-drafting framework"
requires-python = ">=3.12"
license = "LGPL-3.0-only"
license-files = ["LICENSE"]
# PEP 639 SPDX expression above emits License-Expression in the wheel METADATA
# (LIC-01). Intentionally no license trove classifier — PEP 639 tooling treats
# it as a conflicting duplicate of the license expression.
dependencies = [
    "github-copilot-sdk==1.0.13",
    "logfire>=4.37.0",
    "opentelemetry-api>=1.42.1",
    "pydantic>=2",
    "typer>=0.26.7",
    "pyyaml>=6.0.3",
]

# The installed console command. The CLI module stays thin (D-42); the Typer
# app object is the entrypoint target.
[project.scripts]
dogen = "dogen.cli.main:app"

# Bundle the canonical skill family into the wheel so `dogen skills install`
# works from an isolated `uv tool install` (no adjacent source checkout). The
# resolver (dogen.adapters.skills_install.canonical_skills_dir) prefers this
# packaged copy at dogen/skills, then falls back to a repo checkout's top-level
# skills/ for editable and in-repo runs.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "dogen/skills"

[dependency-groups]
dev = [
    "ruff",
    "ty",
    "pytest",
    "pytest-asyncio",
    "pre-commit",
    "import-linter>=2.11",
]

[tool.ruff]
# Captured validation evidence (the round-3 scorer + drafted artifacts under
# validation/) is frozen — not product source — so it stays out of lint/format.
extend-exclude = ["validation"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PL", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests do not require the full public-API docstring/annotation discipline.
"tests/**" = ["D", "ANN", "PLR2004"]

[tool.ty.environment]
python-version = "3.12"
# scripts/ holds the seam guardrail, which tests import directly (single-source
# with the CI/pre-commit step). It is not a package, so expose it to the static
# import resolver via extra-paths.
extra-paths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Declarative provider-seam enforcement (D-29): the SDK is now a real installable
# dependency, so the Phase-1 AST check (scripts/seam_check.py) is upgraded to an
# import-linter forbidden contract. The two run together as belt-and-braces —
# import-linter is the primary declarative gate; the AST check catches dynamic
# forms (importlib by string) its static analysis can miss (RESEARCH Pitfall 4).
# The banned set extends beyond copilot to the observability backends so core/
# can never import a concrete OTel SDK or logfire (OBS-01 survives a backend swap).
# `opentelemetry` is a second root package so the contract can forbid its `.sdk`
# subpackage specifically: core/ may use the vendor-neutral OTel *API*
# (`opentelemetry`/`opentelemetry.trace`) but never the concrete `.sdk` backend
# (D-20 — OBS-01 survives a backend swap). import-linter only allows forbidding a
# subpackage when its top-level package is graphed as a root, not as an external.
[tool.importlinter]
root_packages = ["dogen", "opentelemetry"]
# Required because the remaining forbidden modules (copilot, github_copilot_sdk,
# logfire) are external packages outside the graphed roots.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core stays vendor- and adapter-free (provider seam)"
type = "forbidden"
source_modules = ["dogen.core"]
forbidden_modules = [
    "copilot",
    "github_copilot_sdk",
    "logfire",
    "opentelemetry.sdk",
    "dogen.adapters",
]
