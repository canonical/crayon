[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dogen"
version = "0.0.0"
description = "Agentic documentation-drafting framework"
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE", "LICENSES/*.txt"]
# PEP 639 SPDX expression above emits License-Expression in the wheel METADATA
# (LIC-02). Intentionally no license trove classifier — PEP 639 tooling treats
# it as a conflicting duplicate of the license expression.

[dependency-groups]
dev = ["ruff", "ty", "pytest", "pytest-asyncio", "pre-commit"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901", "PL", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
# Tests do not require the full public-API docstring/annotation discipline.
"tests/**" = ["D", "ANN", "PLR2004"]

[tool.ty.environment]
python-version = "3.12"
# scripts/ holds the seam guardrail, which tests import directly (single-source
# with the CI/pre-commit step). It is not a package, so expose it to the static
# import resolver via extra-paths.
extra-paths = ["scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
