# Local mirror of the CI gates (.github/workflows/ci.yml) for developer DX (D-13).
# The seam check is single-sourced: this hook, the CI step, and tests/test_seam.py
# all invoke scripts/seam_check.py -- there is no duplicated logic to drift.
repos:
  # LIC-01: REUSE/SPDX compliance. rev pinned to the same reuse version uvx and
  # CI resolve (6.2.0) so local and CI run the identical gate.
  - repo: https://github.com/fsfe/reuse-tool
    rev: v6.2.0
    hooks:
      - id: reuse
  # ruff lint + format. rev pinned to the locked ruff (uv.lock: 0.15.18, A2).
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      # SEAM-02: the SAME script CI and pytest run -- no drift.
      - id: seam-check
        name: seam-check (no Copilot imports outside adapters/copilot)
        entry: python scripts/seam_check.py
        language: system
        pass_filenames: false
      # D-29: declarative seam gate, mirroring the CI import-linter step. Runs
      # alongside the AST seam-check above as belt-and-braces (RESEARCH Pitfall 4).
      - id: import-linter
        name: import-linter (seam contract)
        entry: uv run lint-imports
        language: system
        pass_filenames: false
      # D-14: ty has no published stable pre-commit hook yet (beta, A3); run it as
      # a local hook via uv. Re-evaluate swapping to a published hook at ty 1.0.
      - id: ty
        name: ty type check
        entry: uv run ty check
        language: system
        pass_filenames: false
