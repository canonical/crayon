# Read the Docs build configuration. fail_on_warning mirrors the CI `-W`
# warnings-as-errors gate so RTD and CI prove publishability identically.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
