    \ it equals the workshop's base; no cross-check between SDK base and workshop\
    \ base was found anywhere in workshop_file.go, internal/sdk/*, or internal/overlord/*.\
    \ Either locate the actual enforcement point (likely later, at SDK-metadata/provisioning\
    \ time) and cite it, or soften the claim and move it into the report's gaps instead\
    \ of asserting it as validated fact \u2014 this directly contradicts the page's\
    \ own JSON Schema note that the field tables are grounded in the validation code.\
    \ (2) The SDK-entries name row wrongly attributes the 44/48-character limits to\
    \ 'the underlying name (prefix stripped)' \u2014 MAX_SDK_NAME_LENGTH=40 applies\
    \ unconditionally to the name AFTER the prefix is stripped; the 44/48 figures\
    \ come from schema.json's maxLength on the pattern matching the FULL, prefixed\
    \ string (40 + len(try-) = 44, 40 + len(project-) = 48). Reword to: the underlying\
    \ (stripped) name always follows the same 40-character cap and character rules;\
    \ the full field value as written, including any prefix, is therefore at most\
    \ 40 characters unprefixed, 44 with try-, or 48 with project-."
