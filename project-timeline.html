<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DOCPR-2845 Project Timeline</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f3ed;
      --panel: #fffdf8;
      --ink: #1f2623;
      --muted: #66706b;
      --line: #d7d0c4;
      --line-strong: #a69c8d;
      --shadow: 0 14px 40px rgba(31, 38, 35, 0.12);
      --time-col: 156px;
      --pillar-col: 270px;
      --toolbar-height: 0px;
      --radius: 8px;
      --type-story: #316c8e;
      --type-task: #5f7a42;
      --type-spike: #9b5c28;
      --status-todo: #6a6f78;
      --status-done: #2b7a3b;
      --status-in-progress: #b96b00;
      --status-in-review: #2260cc;
      --status-triaged: #4b5d6e;
      --status-untriaged: #8c9ba8;
      --status-deferred: #8a5c92;
      --priority-high: #b94134;
      --priority-medium: #8d702d;
      --priority-low: #66706b;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: grid;
      grid-template-columns: minmax(280px, 1fr) auto;
      gap: 18px;
      align-items: end;
      padding: 18px 22px 14px;
      background: rgba(245, 243, 237, 0.95);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .title-block {
      min-width: 0;
    }

    .eyebrow {
      margin: 0 0 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .subtitle {
      margin: 8px 0 0;
      max-width: 880px;
      color: #4f5a55;
      font-size: 14px;
      line-height: 1.45;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 320px) repeat(4, minmax(132px, auto)) auto auto;
      gap: 8px;
      align-items: center;
      justify-content: end;
    }

    .control,
    .toggle,
    .ghost-button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel);
      color: var(--ink);
      box-shadow: 0 1px 0 rgba(31, 38, 35, 0.04);
    }

    .control {
      width: 100%;
      padding: 8px 10px;
    }

    .toggle {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
      padding: 8px 11px;
      white-space: nowrap;
      user-select: none;
    }

    .toggle input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: #286f6b;
    }

    .ghost-button {
      padding: 8px 11px;
      white-space: nowrap;
    }

    .ghost-button:hover,
    .control:focus,
    .toggle:hover {
      border-color: var(--line-strong);
    }

    .status-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 22px;
      border-bottom: 1px solid var(--line);
      background: #ece8dd;
    }

    .metric,
    .legend-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 5px 9px;
      border: 1px solid rgba(31, 38, 35, 0.12);
      border-radius: 7px;
      background: rgba(255, 253, 248, 0.7);
      color: #33413a;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: currentColor;
    }

    .legend-line {
      width: 24px;
      height: 0;
      border-top: 2px solid #366f8d;
    }

    .workspace {
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      position: relative;
    }

    .board-scroll {
      position: relative;
      overflow: auto;
      min-height: 0;
      height: calc(100vh - var(--toolbar-height));
      overscroll-behavior: contain;
      scrollbar-color: #9a9489 #e8e2d6;
    }

    .board-wrap {
      position: relative;
      width: max-content;
      min-width: 100%;
    }

    .link-layer {
      position: absolute;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      overflow: visible;
    }

    .link-path {
      fill: none;
      stroke: rgba(49, 108, 142, 0.46);
      stroke-width: 2;
      marker-end: url(#arrow-default);
      transition: opacity 120ms ease, stroke-width 120ms ease, stroke 120ms ease;
    }

    .link-path.muted {
      opacity: 0.08;
    }

    .link-path.active {
      stroke: #b94134;
      stroke-width: 3;
      marker-end: url(#arrow-active);
      opacity: 0.94;
    }

    .timeline-grid {
      position: relative;
      z-index: 5;
      display: grid;
      grid-template-columns: var(--time-col) repeat(var(--component-count), var(--pillar-col));
      align-items: stretch;
      min-width: calc(var(--time-col) + (var(--pillar-col) * var(--component-count)));
      padding-bottom: 32px;
    }

    .corner,
    .component-header {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: 86px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(236, 232, 221, 0.96);
      backdrop-filter: blur(14px);
    }

    .corner {
      left: 0;
      z-index: 30;
      padding: 15px 14px;
      border-right: 1px solid var(--line-strong);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 4px;
    }

    .corner strong {
      font-size: 13px;
    }

    .corner span {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.3;
    }

    .component-header {
      padding: 12px 12px 10px;
      border-right: 1px solid var(--line);
    }

    .component-header::before {
      content: "";
      display: block;
      height: 4px;
      margin: -12px -12px 10px;
      background: var(--component-color);
    }

    .component-code {
      display: inline-grid;
      place-items: center;
      width: 28px;
      height: 28px;
      margin-right: 8px;
      border-radius: 7px;
      background: var(--component-color);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      vertical-align: middle;
    }

    .component-name {
      font-size: 15px;
      font-weight: 900;
      vertical-align: middle;
    }

    .component-meta {
      margin-top: 7px;
      color: #53605b;
      font-size: 12px;
      line-height: 1.35;
    }

    .time-cell,
    .lane-cell {
      min-height: 174px;
      border-bottom: 1px solid var(--line);
    }

    .time-cell {
      position: sticky;
      left: 0;
      z-index: 18;
      padding: 18px 13px;
      border-right: 1px solid var(--line-strong);
      background: rgba(245, 243, 237, 0.97);
    }

    .pulse {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--ink);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.1;
    }

    .pulse-index {
      display: grid;
      place-items: center;
      min-width: 32px;
      height: 32px;
      padding: 0 8px;
      border-radius: 7px;
      background: #22312d;
      color: #fff;
      font-size: 12px;
    }

    .pulse-window {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .pulse-count {
      margin-top: 14px;
      color: #59645f;
      font-size: 12px;
      line-height: 1.4;
    }

    .lane-cell {
      position: relative;
      padding: 13px 12px 16px;
      border-right: 1px solid rgba(215, 208, 196, 0.72);
      background:
        linear-gradient(180deg, rgba(255, 253, 248, 0.66), rgba(255, 253, 248, 0.36)),
        linear-gradient(90deg, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0));
    }

    .lane-cell::before {
      content: "";
      position: absolute;
      inset: 0 auto 0 0;
      width: 3px;
      background: color-mix(in srgb, var(--component-color) 48%, transparent);
      opacity: 0.55;
    }

    .card-stack {
      display: grid;
      gap: 10px;
      min-height: 100%;
    }

    .empty-lane {
      min-height: 76px;
    }

    .work-card {
      position: relative;
      z-index: 10;
      display: grid;
      gap: 9px;
      width: 100%;
      min-height: 122px;
      padding: 11px;
      border: 1px solid rgba(31, 38, 35, 0.14);
      border-left: 5px solid var(--component-color);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.96);
      box-shadow: 0 6px 18px rgba(31, 38, 35, 0.07);
      text-align: left;
      transition:
        border-color 120ms ease,
        box-shadow 120ms ease,
        opacity 120ms ease,
        transform 120ms ease;
    }

    .work-card:hover {
      border-color: rgba(31, 38, 35, 0.34);
      box-shadow: 0 10px 24px rgba(31, 38, 35, 0.12);
      transform: translateY(-1px);
    }

    .work-card.selected {
      border-color: #b94134;
      box-shadow: 0 0 0 3px rgba(185, 65, 52, 0.16), 0 12px 26px rgba(31, 38, 35, 0.14);
    }

    .work-card.related {
      border-color: rgba(49, 108, 142, 0.72);
      box-shadow: 0 0 0 3px rgba(49, 108, 142, 0.12), 0 8px 20px rgba(31, 38, 35, 0.1);
    }

    .work-card.dimmed {
      opacity: 0.34;
    }

    .work-card.status-todo,
    .work-card.status-triaged {
      background: rgba(242, 246, 248, 0.96);
    }

    .work-card.status-done {
      background: rgba(238, 250, 241, 0.96);
    }

    .work-card.status-in-progress {
      background: rgba(255, 249, 235, 0.96);
    }

    .work-card.status-in-review {
      background: rgba(240, 246, 255, 0.96);
    }

    .work-card.status-untriaged {
      background: rgba(255, 253, 248, 0.96);
    }

    .work-card.status-deferred {
      background: rgba(252, 244, 255, 0.96);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .item-id {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--ink);
      font-size: 15px;
      font-weight: 950;
    }

    .item-id .mini-pulse {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: flex-end;
    }

    .badge,
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 21px;
      max-width: 100%;
      padding: 3px 7px;
      border-radius: 999px;
      border: 1px solid rgba(31, 38, 35, 0.12);
      background: #f2eee4;
      color: #33413a;
      font-size: 11px;
      font-weight: 850;
      line-height: 1.2;
      white-space: nowrap;
    }

    .badge.type-story {
      background: rgba(49, 108, 142, 0.13);
      color: var(--type-story);
    }

    .badge.type-task {
      background: rgba(95, 122, 66, 0.14);
      color: var(--type-task);
    }

    .badge.type-spike {
      background: rgba(155, 92, 40, 0.14);
      color: var(--type-spike);
    }

    .badge.priority-high {
      background: rgba(185, 65, 52, 0.13);
      color: var(--priority-high);
    }

    .badge.priority-medium {
      background: rgba(141, 112, 45, 0.16);
      color: var(--priority-medium);
    }

    .badge.priority-low {
      background: rgba(102, 112, 107, 0.14);
      color: var(--priority-low);
    }

    .badge.status-todo {
      background: rgba(106, 111, 120, 0.13);
      color: var(--status-todo);
    }

    .badge.status-done {
      background: rgba(43, 122, 59, 0.13);
      color: var(--status-done);
    }

    .badge.status-in-progress {
      background: rgba(185, 107, 0, 0.13);
      color: var(--status-in-progress);
    }

    .badge.status-in-review {
      background: rgba(34, 96, 204, 0.13);
      color: var(--status-in-review);
    }

    .badge.status-triaged {
      background: rgba(75, 93, 110, 0.13);
      color: var(--status-triaged);
    }

    .badge.status-untriaged {
      background: rgba(140, 155, 168, 0.13);
      color: var(--status-untriaged);
    }

    .badge.status-deferred {
      background: rgba(138, 92, 146, 0.13);
      color: var(--status-deferred);
    }

    .card-title {
      margin: 0;
      color: #27312d;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.35;
    }

    .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 5px 8px;
      color: #59645f;
      font-size: 11px;
      line-height: 1.3;
    }

    .meta-pair {
      min-width: 0;
    }

    .meta-pair strong {
      color: #36433e;
      font-weight: 850;
    }

    .dependency-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
      min-height: 22px;
    }

    .dependency-row .label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .chip {
      border-radius: 6px;
      background: #ebe6da;
      color: #3f4a45;
    }

    .chip.clickable {
      cursor: pointer;
    }

    .chip.clickable:hover {
      border-color: #316c8e;
      color: #245c7a;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-top: 1px solid rgba(31, 38, 35, 0.08);
      padding-top: 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .jira-link {
      color: #255f83;
      text-decoration: none;
    }

    .jira-link:hover {
      text-decoration: underline;
    }

    .details {
      position: fixed;
      top: var(--toolbar-height);
      right: 14px;
      z-index: 60;
      width: min(420px, calc(100vw - 28px));
      max-height: calc(100vh - var(--toolbar-height) - 18px);
      overflow: auto;
      padding: 16px;
      border: 1px solid rgba(31, 38, 35, 0.18);
      border-radius: var(--radius);
      background: rgba(255, 253, 248, 0.98);
      box-shadow: var(--shadow);
      transform: translateX(calc(100% + 24px));
      transition: transform 160ms ease;
    }

    .details.open {
      transform: translateX(0);
    }

    .details-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .details h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.15;
    }

    .details-title {
      margin: 8px 0 0;
      color: #33413a;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 800;
    }

    .icon-button {
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: #f5f1e7;
      color: var(--ink);
      font-size: 20px;
      line-height: 1;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin: 14px 0;
    }

    .detail-box {
      min-height: 58px;
      padding: 9px;
      border: 1px solid rgba(31, 38, 35, 0.11);
      border-radius: 7px;
      background: #f6f1e7;
    }

    .detail-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .detail-value {
      margin-top: 4px;
      color: #27312d;
      font-size: 13px;
      font-weight: 850;
      line-height: 1.3;
      overflow-wrap: anywhere;
    }

    .details-section {
      margin-top: 14px;
    }

    .details-section h3 {
      margin: 0 0 8px;
      color: #34413c;
      font-size: 13px;
      font-weight: 950;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .details-section p {
      margin: 0;
      color: #53605b;
      font-size: 13px;
      line-height: 1.45;
    }

    .detail-chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .empty-state {
      display: none;
      padding: 42px 24px;
      color: #53605b;
      font-weight: 800;
    }

    .empty-state.visible {
      display: block;
    }

    @media (max-width: 1180px) {
      .toolbar {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .controls {
        grid-template-columns: minmax(220px, 1fr) repeat(2, minmax(132px, 1fr));
        justify-content: stretch;
      }

      .toggle,
      .ghost-button {
        justify-content: center;
      }
    }

    @media (max-width: 720px) {
      :root {
        --time-col: 132px;
        --pillar-col: 245px;
      }

      .toolbar {
        padding: 14px 12px 12px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .status-strip {
        padding-inline: 12px;
      }

      .corner,
      .component-header {
        min-height: 78px;
      }

      .time-cell,
      .lane-cell {
        min-height: 156px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="toolbar" id="toolbar">
      <div class="title-block">
        <p class="eyebrow">DOCPR-2845 local planning diagram</p>
        <h1>Pulse timeline by component</h1>
        <p class="subtitle">
          Vertical component pillars with pulse windows descending. Cards carry type, priority,
          size, owner class, assignment, status, Jira, and dependency metadata.
        </p>
      </div>

      <form class="controls" id="controls" aria-label="Timeline controls">
        <input class="control" id="searchInput" type="search" placeholder="Search ID, title, Jira, theme" aria-label="Search">
        <select class="control" id="typeFilter" aria-label="Filter by type"></select>
        <select class="control" id="priorityFilter" aria-label="Filter by priority"></select>
        <select class="control" id="ownerFilter" aria-label="Filter by owner"></select>
        <select class="control" id="statusFilter" aria-label="Filter by status"></select>
        <label class="toggle" title="Show dependency lines">
          <input id="dependencyToggle" type="checkbox" checked>
          Dependencies
        </label>
        <button class="ghost-button" id="clearButton" type="button">Clear</button>
      </form>
    </header>

    <section class="status-strip" id="statusStrip" aria-label="Timeline legend and summary"></section>

    <main class="workspace">
      <div class="board-scroll" id="boardScroll" tabindex="0" aria-label="Scrollable project timeline">
        <div class="board-wrap" id="boardWrap">
          <svg class="link-layer" id="linkLayer" aria-hidden="true">
            <defs>
              <marker id="arrow-default" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(49, 108, 142, 0.58)"></path>
              </marker>
              <marker id="arrow-active" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
                <path d="M 0 0 L 10 5 L 0 10 z" fill="#b94134"></path>
              </marker>
            </defs>
          </svg>
          <div class="timeline-grid" id="timelineGrid"></div>
          <div class="empty-state" id="emptyState">No items match the current filters.</div>
        </div>
      </div>
    </main>

    <aside class="details" id="detailsPanel" aria-label="Work item details" aria-hidden="true"></aside>
  </div>

  <script>
    const COMPONENTS = [
      { key: "A", name: "Core", color: "#2f6f9f" },
      { key: "B", name: "Onboarding", color: "#287b68" },
      { key: "C", name: "Lookup", color: "#7b5fb2" },
      { key: "D", name: "Customization", color: "#b45c3a" },
      { key: "E", name: "Generation", color: "#b43c64" },
      { key: "F", name: "HITL", color: "#4f7560" },
      { key: "G", name: "DOCPR-2822", color: "#63752f" },
      { key: "H", name: "Validation", color: "#8b6b2f" },
      { key: "S", name: "Spike", color: "#6661a8" },
      { key: "T", name: "Tail", color: "#5f6670" },
      { key: "Deferred", name: "Deferred", color: "#8c5a89" }
    ];

    const PULSES = [
      { key: "#12", label: "#12", window: "Jun 15-19" },
      { key: "#13", label: "#13", window: "Jun 22-Jul 03" },
      { key: "#14", label: "#14", window: "Jul 06-17" },
      { key: "#15-16", label: "#15-16", window: "Jul 20-Aug 14" },
      { key: "#17", label: "#17", window: "Aug 17-28" },
      { key: "Tail", label: "Tail", window: "Aug 31+" },
      { key: "Deferred", label: "Deferred", window: "end-cycle" }
    ];

    const ITEMS = [

    const byId = new Map(ITEMS.map((item) => [item.id, item]));

    let selectedId = "";

    function componentKeyFor(item) {
      return item.component || item.id.slice(0, 1);
    }

    function componentFor(key) {
      return COMPONENTS.find((component) => component.key === key) || COMPONENTS[0];
    }

    function slug(value) {
      return String(value || "none").toLowerCase().replace(/[^a-z0-9]+/g, "-");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function uniqueValues(field) {
      return [...new Set(ITEMS.map((item) => item[field] || "Unassigned"))].sort((a, b) => a.localeCompare(b));
    }

    function fillSelect(select, label, values) {
      select.innerHTML = [
        `<option value="">${escapeHtml(label)}</option>`,
        ...values.map((value) => `<option value="${escapeHtml(value)}">${escapeHtml(value)}</option>`)
      ].join("");
    }

    function initializeControls() {
      fillSelect(filters.type, "All types", uniqueValues("type"));
      fillSelect(filters.priority, "All priorities", uniqueValues("priority"));
      fillSelect(filters.owner, "All owners", uniqueValues("owner"));
      fillSelect(filters.status, "All statuses", uniqueValues("status"));
      document.getElementById("controls").addEventListener("submit", (event) => event.preventDefault());
      Object.values(filters).forEach((control) => {
        control.addEventListener("input", () => {
          selectedId = "";
          render();
        });
      });
      clearButton.addEventListener("click", () => {
        filters.search.value = "";
        filters.type.value = "";
        filters.priority.value = "";
        filters.owner.value = "";
        filters.status.value = "";
        filters.dependencies.checked = true;
        selectedId = "";
        render();
      });
    }

    function matchesFilters(item) {
      const text = [
        item.id,
        item.title,
        item.status,
        item.pulse,
        item.window,
        item.type,
        item.priority,
        item.size,
        item.theme,
        item.owner,
        item.assignee,
        item.jiraKey,
        item.dependencies.join(" ")
      ].join(" ").toLowerCase();
      const query = filters.search.value.trim().toLowerCase();
      return (
        (!query || text.includes(query)) &&
        (!filters.type.value || item.type === filters.type.value) &&
        (!filters.priority.value || item.priority === filters.priority.value) &&
        (!filters.owner.value || (item.owner || "Unassigned") === filters.owner.value) &&
        (!filters.status.value || item.status === filters.status.value)
      );
    }

    function upstreamIds(id, found = new Set()) {
      const item = byId.get(id);
      if (!item) return found;
      item.dependencies.forEach((dependency) => {
        if (!found.has(dependency)) {
          found.add(dependency);
          upstreamIds(dependency, found);
        }
      });
      return found;
    }

    function downstreamIds(id, found = new Set()) {
      ITEMS.forEach((item) => {
        if (item.dependencies.includes(id) && !found.has(item.id)) {
          found.add(item.id);
          downstreamIds(item.id, found);
        }
      });
      return found;
    }

    function dependencyLabel(item) {
      if (!item.dependencies.length) return `<span class="chip">No dependencies</span>`;
      return item.dependencies
        .map((dependency) => {
          const exists = byId.has(dependency);
          const className = exists ? "chip clickable" : "chip";
          return `<span class="${className}" data-focus-id="${escapeHtml(dependency)}">${escapeHtml(dependency)}</span>`;
        })
        .join("");
    }

    function renderCard(item) {
      const component = componentFor(componentKeyFor(item));
      const typeClass = `type-${slug(item.type)}`;
      const priorityClass = `priority-${slug(item.priority)}`;
      const statusClass = `status-${slug(item.status)}`;
      const assignee = item.assignee || "Unassigned";
      return `
        <button class="work-card ${statusClass}" type="button" data-id="${escapeHtml(item.id)}" style="--component-color: ${component.color}">
          <span class="card-top">
            <span class="item-id">
              ${escapeHtml(item.id)}
              <span class="mini-pulse">${escapeHtml(item.pulse)}</span>
            </span>
            <span class="badges">
              <span class="badge ${statusClass}">${escapeHtml(item.status)}</span>
              <span class="badge ${typeClass}">${escapeHtml(item.type)}</span>
            </span>
          </span>
          <span class="card-title">${escapeHtml(item.title)}</span>
          <span class="card-meta">
            <span class="meta-pair"><strong>Priority</strong> ${escapeHtml(item.priority)}</span>
            <span class="meta-pair"><strong>Size</strong> ${escapeHtml(item.size)}</span>
            <span class="meta-pair"><strong>Owner</strong> ${escapeHtml(item.owner || "Unassigned")}</span>
            <span class="meta-pair"><strong>Assignee</strong> ${escapeHtml(assignee)}</span>
          </span>
          <span class="dependency-row">
            <span class="label">Needs</span>
            ${dependencyLabel(item)}
          </span>
          <span class="card-footer">
            <span>${escapeHtml(item.theme)}</span>
            <a class="jira-link" href="${escapeHtml(item.jiraUrl)}" target="_blank" rel="noreferrer" onclick="event.stopPropagation()">${escapeHtml(item.jiraKey)}</a>
          </span>
        </button>
      `;
    }

    function renderGrid() {
      const visibleSet = new Set(visibleItems.map((item) => item.id));
      grid.style.setProperty("--component-count", COMPONENTS.length);
      const header = [
        `<div class="corner"><strong>Timeline</strong><span>Scroll down by pulse and across by component.</span></div>`,
        ...COMPONENTS.map((component) => {
          const count = visibleItems.filter((item) => componentKeyFor(item) === component.key).length;
          const dependencyCount = visibleItems.reduce((total, item) => {
            if (componentKeyFor(item) !== component.key) return total;
            return total + item.dependencies.filter((dependency) => visibleSet.has(dependency)).length;
          }, 0);
          return `
            <div class="component-header" style="--component-color: ${component.color}">
              <span class="component-code">${escapeHtml(component.key === "Deferred" ? "Def" : component.key)}</span>
              <span class="component-name">${escapeHtml(component.name)}</span>
              <div class="component-meta">${count} visible item${count === 1 ? "" : "s"} / ${dependencyCount} visible dependencies</div>
            </div>
          `;
        })
      ];

      const rows = [];
      PULSES.forEach((pulse) => {
        const pulseItems = visibleItems.filter((item) => item.pulse === pulse.key);
        rows.push(`
          <div class="time-cell">
            <div class="pulse"><span class="pulse-index">${escapeHtml(pulse.label)}</span></div>
            <div class="pulse-window">${escapeHtml(pulse.window)}</div>
            <div class="pulse-count">${pulseItems.length} visible item${pulseItems.length === 1 ? "" : "s"}</div>
          </div>
        `);
        COMPONENTS.forEach((component) => {
          const cards = pulseItems
            .filter((item) => componentKeyFor(item) === component.key)
            .map(renderCard)
            .join("");
          rows.push(`
            <div class="lane-cell" style="--component-color: ${component.color}">
              <div class="card-stack">${cards || '<div class="empty-lane"></div>'}</div>
            </div>
          `);
        });
      });
      grid.innerHTML = [...header, ...rows].join("");
    }

    function renderStatusStrip() {
      const dependencyCount = visibleItems.reduce((total, item) => {
        return total + item.dependencies.filter((dependency) => visibleItems.some((visible) => visible.id === dependency)).length;
      }, 0);
      const statusCounts = visibleItems.reduce((counts, item) => {
        counts[item.status] = (counts[item.status] || 0) + 1;
        return counts;
      }, {});
      statusStrip.innerHTML = `
        <span class="metric">${visibleItems.length} / ${ITEMS.length} items</span>
        <span class="metric">${dependencyCount} visible dependency lines</span>
        ${Object.entries(statusCounts).map(([status, count]) => `<span class="metric badge status-${slug(status)}">${escapeHtml(status)}: ${count}</span>`).join("")}
        <span class="legend-chip" style="color: var(--type-story)"><span class="legend-dot"></span>Story</span>
        <span class="legend-chip" style="color: var(--type-task)"><span class="legend-dot"></span>Task</span>
        <span class="legend-chip" style="color: var(--type-spike)"><span class="legend-dot"></span>Spike</span>
        <span class="legend-chip" style="color: var(--priority-high)"><span class="legend-dot"></span>High priority</span>
        <span class="legend-chip"><span class="legend-line"></span>Dependency</span>
      `;
    }

    function drawLinks() {
      const defs = linkLayer.querySelector("defs").outerHTML;
      linkLayer.innerHTML = defs;
      const dependencyVisible = filters.dependencies.checked;
      if (!dependencyVisible || !visibleItems.length) return;

      const gridRect = grid.getBoundingClientRect();
      linkLayer.setAttribute("width", String(grid.scrollWidth));
      linkLayer.setAttribute("height", String(grid.scrollHeight));
      linkLayer.style.width = `${grid.scrollWidth}px`;
      linkLayer.style.height = `${grid.scrollHeight}px`;

      const visibleIds = new Set(visibleItems.map((item) => item.id));
      const activeRelated = selectedId
        ? new Set([...upstreamIds(selectedId), ...downstreamIds(selectedId), selectedId])
        : new Set();

      visibleItems.forEach((target) => {
        target.dependencies.forEach((sourceId) => {
          if (!visibleIds.has(sourceId)) return;
          const sourceNode = grid.querySelector(`[data-id="${CSS.escape(sourceId)}"]`);
          const targetNode = grid.querySelector(`[data-id="${CSS.escape(target.id)}"]`);
          if (!sourceNode || !targetNode) return;

          const sourceRect = sourceNode.getBoundingClientRect();
          const targetRect = targetNode.getBoundingClientRect();
          const x1 = sourceRect.left + sourceRect.width / 2 - gridRect.left;
          const y1 = sourceRect.bottom - gridRect.top;
          const x2 = targetRect.left + targetRect.width / 2 - gridRect.left;
          const y2 = targetRect.top - gridRect.top;
          const gap = y2 - y1;
          const bend = Math.max(34, Math.min(120, Math.abs(gap) / 2));
          const controlY1 = y1 + (gap >= 0 ? bend : -bend);
          const controlY2 = y2 - (gap >= 0 ? bend : -bend);
          const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
          path.setAttribute("d", `M ${x1} ${y1} C ${x1} ${controlY1}, ${x2} ${controlY2}, ${x2} ${y2}`);
          path.setAttribute("class", "link-path");
          path.setAttribute("data-source", sourceId);
          path.setAttribute("data-target", target.id);
          if (selectedId) {
            const isActive = activeRelated.has(sourceId) && activeRelated.has(target.id);
            path.classList.toggle("active", isActive);
            path.classList.toggle("muted", !isActive);
          }
          linkLayer.appendChild(path);
        });
      });
    }

    function syncToolbarHeight() {
      const toolbarHeight = toolbar.getBoundingClientRect().height + statusStrip.getBoundingClientRect().height;
      document.documentElement.style.setProperty("--toolbar-height", `${toolbarHeight}px`);

    function applySelectionClasses() {
      const cards = grid.querySelectorAll(".work-card");
      const upstream = selectedId ? upstreamIds(selectedId) : new Set();
      const downstream = selectedId ? downstreamIds(selectedId) : new Set();
      cards.forEach((card) => {
        const id = card.dataset.id;
        const selected = id === selectedId;
        const related = upstream.has(id) || downstream.has(id);
        card.classList.toggle("selected", selected);
        card.classList.toggle("related", related);
        card.classList.toggle("dimmed", Boolean(selectedId && !selected && !related));
      });
    }

    function renderDetails(item) {
      if (!item) {
        detailsPanel.classList.remove("open");
        detailsPanel.setAttribute("aria-hidden", "true");
        detailsPanel.innerHTML = "";
        return;
      }
      const upstream = [...upstreamIds(item.id)];
      const downstream = [...downstreamIds(item.id)];
      detailsPanel.innerHTML = `
        <div class="details-head">
          <div>
            <h2>${escapeHtml(item.id)} <span class="badge status-${slug(item.status)}">${escapeHtml(item.status)}</span></h2>
            <p class="details-title">${escapeHtml(item.title)}</p>
          </div>
          <button class="icon-button" type="button" id="closeDetails" aria-label="Close details">x</button>
        </div>
        <div class="details-grid">
          <div class="detail-box"><div class="detail-label">Pulse</div><div class="detail-value">${escapeHtml(item.pulse)} / ${escapeHtml(item.window)}</div></div>
          <div class="detail-box"><div class="detail-label">Component</div><div class="detail-value">${escapeHtml(componentFor(componentKeyFor(item)).name)}</div></div>
          <div class="detail-box"><div class="detail-label">Type</div><div class="detail-value">${escapeHtml(item.type)}</div></div>
          <div class="detail-box"><div class="detail-label">Priority / size</div><div class="detail-value">${escapeHtml(item.priority)} / ${escapeHtml(item.size)}</div></div>
          <div class="detail-box"><div class="detail-label">Owner class</div><div class="detail-value">${escapeHtml(item.owner || "Unassigned")}</div></div>
          <div class="detail-box"><div class="detail-label">Assignee</div><div class="detail-value">${escapeHtml(item.assignee || "Unassigned")}</div></div>
          <div class="detail-box"><div class="detail-label">Theme</div><div class="detail-value">${escapeHtml(item.theme)}</div></div>
          <div class="detail-box"><div class="detail-label">Jira</div><div class="detail-value"><a class="jira-link" href="${escapeHtml(item.jiraUrl)}" target="_blank" rel="noreferrer">${escapeHtml(item.jiraKey)}</a></div></div>
        </div>
        <div class="details-section">
          <h3>Direct dependencies</h3>
          <div class="detail-chip-list">${item.dependencies.length ? dependencyLabel(item) : '<span class="chip">None</span>'}</div>
        </div>
        <div class="details-section">
          <h3>Upstream chain</h3>
          <div class="detail-chip-list">${upstream.length ? upstream.map((id) => `<span class="chip clickable" data-focus-id="${escapeHtml(id)}">${escapeHtml(id)}</span>`).join("") : '<span class="chip">None</span>'}</div>
        </div>
        <div class="details-section">
          <h3>Downstream chain</h3>
          <div class="detail-chip-list">${downstream.length ? downstream.map((id) => `<span class="chip clickable" data-focus-id="${escapeHtml(id)}">${escapeHtml(id)}</span>`).join("") : '<span class="chip">None</span>'}</div>
        </div>
        <div class="details-section">
          <h3>Update hook</h3>
          <p>To update the diagram later, edit this item's embedded data object: status, assignee, owner, dependencies, or other metadata.</p>
        </div>
      `;
      detailsPanel.classList.add("open");
      detailsPanel.setAttribute("aria-hidden", "false");
      document.getElementById("closeDetails").addEventListener("click", () => {
        selectedId = "";
        renderDetails(null);
        applySelectionClasses();
        drawLinks();
      });
      detailsPanel.querySelectorAll("[data-focus-id]").forEach((chip) => {
        chip.addEventListener("click", (event) => {
          event.stopPropagation();
          focusItem(chip.dataset.focusId);
        });
      });
    }

    function focusItem(id) {
      if (!byId.has(id)) return;
      selectedId = id;
      renderDetails(byId.get(id));
      applySelectionClasses();
      drawLinks();
      const node = grid.querySelector(`[data-id="${CSS.escape(id)}"]`);
      if (node) {
        node.scrollIntoView({ block: "center", inline: "center", behavior: "smooth" });
      }
    }

    function wireGridInteractions() {
      grid.querySelectorAll(".work-card").forEach((card) => {
        card.addEventListener("click", () => focusItem(card.dataset.id));
      });
      document.querySelectorAll("[data-focus-id]").forEach((chip) => {
        chip.addEventListener("click", (event) => {
          event.stopPropagation();
          focusItem(chip.dataset.focusId);
        });
      });
    }

    function render() {
      visibleItems = ITEMS.filter(matchesFilters);
      renderStatusStrip();
      renderGrid();
      emptyState.classList.toggle("visible", visibleItems.length === 0);
      syncToolbarHeight();
      wireGridInteractions();
      renderDetails(selectedId ? byId.get(selectedId) : null);
      applySelectionClasses();
      requestAnimationFrame(drawLinks);
    }

    initializeControls();
    render();
    window.addEventListener("resize", () => {
      syncToolbarHeight();
      requestAnimationFrame(drawLinks);
    });
    boardScroll.addEventListener("scroll", () => {
      if (selectedId) requestAnimationFrame(drawLinks);
    }, { passive: true });
  </script>
</body>
</html>
